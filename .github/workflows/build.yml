name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgit2-dev pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist/git-pet
          cp build/git-pet dist/git-pet/
          strip dist/git-pet/git-pet
          cp -r assets dist/git-pet/assets
          rm -f dist/git-pet/assets/*.aseprite
          cp README.md dist/git-pet/
          tar -C dist -czf git-pet-linux-x86_64.tar.gz git-pet

      - uses: actions/upload-artifact@v4
        with:
          name: git-pet-linux-x86_64
          path: git-pet-linux-x86_64.tar.gz

  windows:
    name: Windows (x86_64, MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libgit2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist/git-pet
          cp build/git-pet.exe dist/git-pet/
          strip dist/git-pet/git-pet.exe
          # Bundle every MinGW runtime DLL the exe depends on (libgit2, libstdc++, etc.)
          ldd build/git-pet.exe | awk '/\/mingw64\// {print $3}' | sort -u | xargs -I{} cp {} dist/git-pet/
          cp -r assets dist/git-pet/assets
          rm -f dist/git-pet/assets/*.aseprite
          cp README.md install.ps1 dist/git-pet/
          cd dist && zip -r ../git-pet-windows-x86_64.zip git-pet

      - uses: actions/upload-artifact@v4
        with:
          name: git-pet-windows-x86_64
          path: git-pet-windows-x86_64.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
