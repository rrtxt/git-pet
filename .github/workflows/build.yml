name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x86_64)
    # Oldest supported runner: the binary needs a glibc at least this old
    runs-on: ubuntu-22.04
    env:
      LIBGIT2_VERSION: v1.9.7
      LIBGIT2_PREFIX: ${{ github.workspace }}/libgit2-static
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # std::format needs GCC 13, which 22.04 only has via the toolchain PPA
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config gcc-13 g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Cache static libgit2
        id: libgit2-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBGIT2_PREFIX }}
          key: libgit2-${{ env.LIBGIT2_VERSION }}-ubuntu-22.04-static

      # git-pet only reads local repositories, so network transports are off.
      # Everything else uses libgit2's bundled copies, leaving no runtime deps.
      - name: Build static libgit2
        if: steps.libgit2-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LIBGIT2_VERSION" https://github.com/libgit2/libgit2.git libgit2-src
          cmake -S libgit2-src -B libgit2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LIBGIT2_PREFIX" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_CLI=OFF \
            -DUSE_HTTPS=OFF \
            -DUSE_SSH=OFF \
            -DUSE_GSSAPI=OFF \
            -DUSE_NTLMCLIENT=OFF \
            -DUSE_BUNDLED_ZLIB=ON \
            -DREGEX_BACKEND=builtin \
            -DUSE_HTTP_PARSER=builtin \
            -DUSE_SHA1=CollisionDetection \
            -DUSE_SHA256=builtin
          cmake --build libgit2-build
          cmake --install libgit2-build

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$LIBGIT2_PREFIX/lib/pkgconfig"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIT_PET_STATIC=ON

      - name: Build
        run: cmake --build build

      - name: Check for dynamic libgit2
        run: |
          ldd build/git-pet
          if ldd build/git-pet | grep -qE 'libgit2|libstdc\+\+'; then
            echo "::error::git-pet is still dynamically linked to libgit2 or libstdc++"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist/git-pet
          cp build/git-pet dist/git-pet/
          strip dist/git-pet/git-pet
          cp -r assets dist/git-pet/assets
          rm -f dist/git-pet/assets/*.aseprite
          cp README.md dist/git-pet/
          tar -C dist -czf git-pet-linux-x86_64.tar.gz git-pet

      - uses: actions/upload-artifact@v4
        with:
          name: git-pet-linux-x86_64
          path: git-pet-linux-x86_64.tar.gz

  windows:
    name: Windows (x86_64, MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libgit2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist/git-pet
          cp build/git-pet.exe dist/git-pet/
          strip dist/git-pet/git-pet.exe
          # Bundle every MinGW runtime DLL the exe depends on (libgit2, libstdc++, etc.)
          ldd build/git-pet.exe | awk '/\/mingw64\// {print $3}' | sort -u | xargs -I{} cp {} dist/git-pet/
          cp -r assets dist/git-pet/assets
          rm -f dist/git-pet/assets/*.aseprite
          cp README.md install.ps1 dist/git-pet/
          cd dist && zip -r ../git-pet-windows-x86_64.zip git-pet

      - uses: actions/upload-artifact@v4
        with:
          name: git-pet-windows-x86_64
          path: git-pet-windows-x86_64.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
